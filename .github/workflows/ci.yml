name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-core:
    name: forge-core (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: services/forge-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check forge tests

      - name: Tests
        run: pytest -q

      # The tie-out gate. If the generated books stop reconciling, every finding
      # downstream is built on numbers that do not add up, so this blocks before
      # anything else is considered.
      - name: Data gate (tie-out)
        run: forge tieout

      # ForgeBench is the release gate. It exits non-zero when critical recall
      # drops, a decoy is reported, or a control raises. Nothing merges past it.
      - name: ForgeBench release gate
        run: forge bench

      - name: Publish bench result
        if: always()
        run: forge bench --json --no-strict > forgebench.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgebench-${{ matrix.python }}
          path: services/forge-core/forgebench.json
          if-no-files-found: ignore
