[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-core"
version = "0.1.0"
description = "ForgeOS core: evidence-first deterministic finance engine, control library and review hierarchy"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
# E501: line length is handled by the formatter, not by failing the build.
# UP042: enums deliberately subclass (str, Enum) rather than StrEnum so that a
#        value round-trips through JSON as a plain string on every supported
#        runtime, which the evidence bundle and the audit log both rely on.
# B008:  typer expresses CLI options as call defaults; that is the framework's
#        documented idiom, not an accident.
ignore = ["E501", "UP042", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
